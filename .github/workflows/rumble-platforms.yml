name: Rumble platform builds

on:
  push:
    branches: [feat/upstream-gamepad-rumble, feat/gamepad-rumble]
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/rumble-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-rumble-regressions:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared Apple implementation and failure handling
        run: |
          for source in GamepadRumble RumbleEffect RumbleDiagnostics; do
            cmp "packages/gamepads_darwin/macos/Classes/$source.swift" "packages/gamepads_ios/ios/Classes/$source.swift"
          done
          swiftc packages/gamepads_darwin/macos/Classes/RumbleEffect.swift packages/gamepads_darwin/macos/Tests/RumbleEffectTests.swift -o "$RUNNER_TEMP/rumble-tests"
          "$RUNNER_TEMP/rumble-tests"
      - name: Typecheck Apple APIs with production logging enabled
        run: |
          swiftc -typecheck -D CPP_LOG_AVAILABLE packages/gamepads_darwin/macos/Classes/{GamepadRumble,RumbleEffect,RumbleDiagnostics}.swift
          xcrun --sdk iphonesimulator swiftc -typecheck -D CPP_LOG_AVAILABLE -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios14.0-simulator packages/gamepads_ios/ios/Classes/{GamepadRumble,RumbleEffect,RumbleDiagnostics}.swift
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: windows --debug
          - os: ubuntu-latest
            platform: linux
            command: linux --debug
          - os: ubuntu-latest
            platform: android
            command: apk --debug
          - os: ubuntu-latest
            platform: web
            command: web --release
          - os: macos-latest
            platform: macos
            command: macos --debug
          - os: macos-latest
            platform: ios
            command: ios --simulator --debug --no-codesign
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - name: Generate example platform runner
        working-directory: packages/gamepads/example
        run: flutter create --platforms=${{ matrix.platform }} --project-name gamepads_example --no-pub .
      - name: Compile platform implementation
        working-directory: packages/gamepads/example
        run: flutter build ${{ matrix.command }}
      - name: Configure Windows rumble regression
        if: matrix.platform == 'windows'
        run: cmake -S packages/gamepads_windows/windows/test -B build/rumble-test
      - name: Run Android device detection regression
        if: matrix.platform == 'android'
        working-directory: packages/gamepads/example/android
        run: ./gradlew :gamepads_android:testDebugUnitTest
      - name: Build Windows rumble regression
        if: matrix.platform == 'windows'
        run: cmake --build build/rumble-test --config Release
      - name: Run Windows rumble regression
        if: matrix.platform == 'windows'
        run: ctest --test-dir build/rumble-test -C Release --output-on-failure
      - name: Run Linux rumble regression
        if: matrix.platform == 'linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror packages/gamepads_linux/linux/test/rumble_test.cpp -o "$RUNNER_TEMP/rumble_test"
          "$RUNNER_TEMP/rumble_test"
